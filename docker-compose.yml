# Local development stack.  (Rails equivalent: docker-compose.yml you already use)
services:
  web:
    build: .
    command: flask --app wsgi run --host 0.0.0.0 --port 8000 --debug   # reloads on change, like `rails s`
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app            # live-mount code so edits show up without rebuilding
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: .
    command: rq worker --url redis://redis:6379/0 default   # Sidekiq's role
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - web

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pizza
      POSTGRES_PASSWORD: pizza
      POSTGRES_DB: pizza_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza -d pizza_dev"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7

volumes:
  pgdata:
